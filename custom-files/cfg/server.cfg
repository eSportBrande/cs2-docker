// Baseline CS2 server config, layered on top of the read-only master at startup.
//
// IMPORTANT: do NOT set rcon_password here. It is driven only from the
// CSGO_RCON_PASSWORD env/Secret via the launch flag, so the management plane
// stays the single source of truth (the old CS:GO image's hardcoded password
// was a footgun).

sv_lan 0

// Rates (competitive-friendly defaults).
sv_minrate 786432
sv_mincmdrate 64
sv_minupdaterate 64

// Logging so the console/log sidecar and RCON can observe the match.
log on
sv_logecho 1
sv_logfile 1

// Convenience aliases (mirror the ESL match flow). Copy the validated ESL
// match configs from friends/docker-csgo/base/custom-files/cfg into this dir
// (pruned for CS2 convars) to enable exec-based match presets.
// alias "warmup"  "exec pregame.cfg"
// alias "mr12"    "exec esl_mr12.cfg"
// alias "knife"   "exec knife.cfg"
