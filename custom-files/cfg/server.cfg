// DO NOT SET SV_LAN HERE IT COMES IN THE STARTUP +SV_LAN WITH LOGIC AROUND GSLT.

// Logging
log on
sv_logecho 1
sv_logfile 1

// Hibernation needs to be disabled, due to Kubernetes way of freeing network.
sv_hibernate_when_empty 0

// BOT:
bot_join_after_player 1
bot_quota 0
bot_quota_mode normal

// Disable automatic kicking of players due to Teamkill
mp_autokick 0