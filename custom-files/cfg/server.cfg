// sv_lan: deliberately NOT set. Engine default is already 0, and any sv_lan
// write during the first spawn (this file execs mid-boot) makes the engine
// drop its game UDP socket — deaf server until a manual changelevel. The
// entrypoint likewise passes no +sv_lan. Verified 2026-07-06.

// Logging
log on
sv_logecho 1
sv_logfile 1

// Hibernation: deliberately NOT configured (engine default). Explicitly
// enabling sv_hibernate_when_empty made cold empty boots hibernate mid-init
// and tear down the game UDP socket — permanently deaf pods (spawn 1, no
// udp/ip in status, /proc/net/udp empty; a manual changelevel revived them).
// If fresh servers boot deaf again, the engine default is hibernate-on and
// this needs an explicit `sv_hibernate_when_empty 0` here.

// BOT:
bot_join_after_player 1
bot_quota 0
bot_quota_mode normal